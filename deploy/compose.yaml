# Production stack. Run through deploy/server-deploy.sh, which supplies --env-file.
#
# Nothing is published on the host: the `web` container joins the server's existing `proxy`
# network, where the Cloudflare Tunnel reaches it as http://boardgames-web:80.

name: boardgames

# Docker keeps every line a container prints, for ever, unless told otherwise.
x-logging: &logging
  driver: json-file
  options:
    max-size: 10m
    max-file: '3'

# A check every few seconds is a process started every few seconds, all day. Once a service is
# up it is asked twice a minute; `start_interval` keeps the first answer, and so a deploy, quick.
x-healthcheck: &healthcheck
  interval: 30s
  timeout: 3s
  retries: 3
  start_period: 60s
  start_interval: 2s

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: bgp
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in .env}
      POSTGRES_DB: bgp
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks: [internal]
    healthcheck:
      <<: *healthcheck
      test: ['CMD-SHELL', 'pg_isready -U bgp -d bgp']
    logging: *logging

  api:
    # CI builds this image and the server pulls it by commit. Without IMAGE_TAG (a build by hand,
    # or on a server that cannot reach the registry) it is built here from the Dockerfile.
    image: ${IMAGE_REPO:-ghcr.io/pmhnam/boardgames}/api:${IMAGE_TAG:-local}
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      target: api
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgres://bgp:${POSTGRES_PASSWORD}@postgres:5432/bgp
      JWT_SECRET: ${JWT_SECRET:?set in .env}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      # Two proxies sit in front of the API: the Cloudflare Tunnel, then nginx in `web`. Sign-in
      # throttling needs the caller's own address, which is that many hops back.
      TRUST_PROXY: ${TRUST_PROXY:-2}
      # Voice calls go from browser to browser. Left empty, they find each other through public
      # STUN servers, which a strict network cannot get through: list TURN servers here, as
      # JSON in the shape of WebRTC's iceServers.
      VOICE_ICE_SERVERS: ${VOICE_ICE_SERVERS:-}
      VOICE_MAX_PEERS: ${VOICE_MAX_PEERS:-8}
    depends_on:
      postgres:
        condition: service_healthy
    networks: [internal]
    healthcheck:
      <<: *healthcheck
      # busybox wget, not `node -e`: a whole Node runtime is a lot to start for one request.
      test: ['CMD-SHELL', 'wget -q -O /dev/null http://127.0.0.1:3000/api/health']
    logging: *logging

  web:
    image: ${IMAGE_REPO:-ghcr.io/pmhnam/boardgames}/web:${IMAGE_TAG:-local}
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      target: web
    container_name: boardgames-web
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    networks: [internal, proxy]
    healthcheck:
      <<: *healthcheck
      test: ['CMD-SHELL', 'wget -q -O /dev/null http://127.0.0.1/api/health']
    logging: *logging

volumes:
  pgdata:

networks:
  internal:
  proxy:
    external: true
