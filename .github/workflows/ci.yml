name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  IMAGE_REPO: ghcr.io/${{ github.repository }}

jobs:
  check:
    runs-on: ubuntu-latest
    # A newer push to a pull request makes the run for the older one pointless. Runs on main
    # are each left to finish: every one of them is a commit that may be deployed.
    concurrency:
      group: check-${{ github.ref }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      # Turbo skips the build, typecheck and tests of every package the commit did not touch,
      # as long as it remembers the last run.
      - uses: actions/cache@v4
        with:
          path: .turbo/cache
          key: turbo-${{ runner.os }}-${{ github.sha }}
          restore-keys: turbo-${{ runner.os }}-
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm turbo run build typecheck test --cache-dir=.turbo/cache

  # Built here rather than on the server, which has matches to run and little to spare for a
  # compiler. Runs beside `check`; nothing is deployed unless both pass.
  images:
    name: Images
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    # The server is ARM. Built on the same architecture, the image is the one that will run,
    # and the stack started below is a true rehearsal of it.
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The two targets share one build stage, so the second costs only its last few layers.
      - name: Build the API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile
          target: api
          load: true
          tags: ${{ env.IMAGE_REPO }}/api:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Build the web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile
          target: web
          load: true
          tags: ${{ env.IMAGE_REPO }}/web:${{ github.sha }}
          cache-from: type=gha

      # The production stack, started from these very images: one that cannot boot, migrate or
      # answer through nginx stops here instead of on the server.
      - name: Start the stack
        env:
          IMAGE_TAG: ${{ github.sha }}
          POSTGRES_PASSWORD: ci-only
          JWT_SECRET: ci-only-0123456789abcdef0123456789abcdef
        run: |
          docker network create proxy
          if ! docker compose -f deploy/compose.yaml up --detach --no-build --wait; then
            docker compose -f deploy/compose.yaml logs --no-color --tail 100
            exit 1
          fi

      - name: Push the images
        run: |
          docker push "$IMAGE_REPO/api:$GITHUB_SHA"
          docker push "$IMAGE_REPO/web:$GITHUB_SHA"

  deploy:
    name: Deploy
    needs: [check, images]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    # Deploys run one after another, in order; none is skipped or cut short.
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    steps:
      - name: Check that deploy is configured
        id: config
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          if [ -z "$VPS_SSH_KEY" ]; then
            echo "::notice::Deploy secrets are not set (see docs/deployment.md). Skipping."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      # The server pulls and starts the commit itself. This key can do nothing else there:
      # whatever is sent as the command is read as "deploy this commit" (deploy/server-deploy.sh).
      - name: Deploy this commit
        if: steps.config.outputs.ready == 'true'
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$VPS_KNOWN_HOSTS" > ~/.ssh/known_hosts
          ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            "$VPS_USER@$VPS_HOST" "$GITHUB_SHA"
